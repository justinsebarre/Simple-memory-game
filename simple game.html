<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegio De Montalban Simple Memory Game</title>
  <style>
    body {
      background: linear-gradient(135deg, #bbdefb, #e3f2fd);
      font-family: "Poppins", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      margin-top: 20px;
    }

    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #0d47a1;
      display: block;
      margin: 0 auto 10px auto;
    }

    h1 {
      color: #0d47a1;
      font-size: 26px;
      margin: 0;
    }

    marquee {
      background-color: #1565c0;
      padding: 8px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      border-top: 2px solid #0d47a1;
      border-bottom: 2px solid #0d47a1;
      color: white;
      animation: colorChange 3s infinite;
    }

    @keyframes colorChange {
      0% { color: #fff; }
      25% { color: #ffeb3b; }
      50% { color: #00e676; }
      75% { color: #ff4081; }
      100% { color: #fff; }
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px 0;
      color: #0d47a1;
      font-size: 18px;
      font-weight: bold;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-gap: 10px;
      justify-content: center;
      margin: 30px auto;
    }

    .card {
      width: 100px;
      height: 100px;
      background-color: #64b5f6;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: transparent;
      transition: all 0.3s ease;
    }

    .card.flipped {
      background-color: #ffffff;
      color: #1565c0;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    button {
      background: #1565c0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      background: #0d47a1;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #0d47a1;
    }

    img.symbol {
      width: 60px;
      height: 60px;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i.ibb.co/6mRXBtF/CDM-logo.png" alt="Colegio De Montalban Logo">
    <h1>Colegio De Montalban Simple Memory Game</h1>
  </header>

  <marquee behavior="scroll" direction="left">
    🎓 Welcome to Colegio De Montalban Themed Memory Game! | Match all CDM symbols to test your memory! 🧠🔥
  </marquee>

  <div class="stats">
    <div>⏱️ Time: <span id="timer">0</span> s</div>
    <div>🏆 Best Time: <span id="bestTime">--</span> s</div>
    <div>🎯 Score: <span id="score">0</span></div>
  </div>

  <div class="game-board" id="gameBoard"></div>
  <button onclick="startGame()">Restart</button>

  <footer>© 2025 Colegio De Montalban | BSIT Project</footer>

  <script>
    const symbols = [
      'https://i.ibb.co/xh5D6jx/letter-c.png',
      'https://i.ibb.co/CM3VZWn/letter-d.png',
      'https://i.ibb.co/Tc6Q6Tt/letter-m.png',
      'https://i.ibb.co/99Z5qqS/torch.png',
      'https://i.ibb.co/k0wN2DB/book.png',
      'https://i.ibb.co/yYpWqQZ/leaf.png',
      'https://i.ibb.co/xh5D6jx/letter-c.png',
      'https://i.ibb.co/CM3VZWn/letter-d.png',
      'https://i.ibb.co/Tc6Q6Tt/letter-m.png',
      'https://i.ibb.co/99Z5qqS/torch.png',
      'https://i.ibb.co/k0wN2DB/book.png',
      'https://i.ibb.co/yYpWqQZ/leaf.png'
    ];

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let timer = 0;
    let timerInterval = null;
    let matchedPairs = 0;
    let score = 0;
    let bestTime = localStorage.getItem('bestTime');

    if (bestTime) {
      document.getElementById('bestTime').textContent = bestTime;
    }

    function startGame() {
      const board = document.getElementById('gameBoard');
      board.innerHTML = '';
      document.getElementById('timer').textContent = 0;
      document.getElementById('score').textContent = 0;
      matchedPairs = 0;
      score = 0;
      timer = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      let shuffled = symbols.sort(() => 0.5 - Math.random());
      shuffled.forEach(symbol => {
        const card = document.createElement('div');
        card.classList.add('card');
        const img = document.createElement('img');
        img.src = symbol;
        img.classList.add('symbol');
        card.appendChild(img);
        img.style.visibility = 'hidden';
        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function updateTimer() {
      timer++;
      document.getElementById('timer').textContent = timer;
    }

    function flipCard() {
      if (lockBoard || this === firstCard) return;
      this.classList.add('flipped');
      const img = this.querySelector('img');
      img.style.visibility = 'visible';

      if (!firstCard) {
        firstCard = this;
        return;
      }

      secondCard = this;
      checkMatch();
    }

    function checkMatch() {
      let isMatch = firstCard.querySelector('img').src === secondCard.querySelector('img').src;
      isMatch ? handleMatch() : handleNoMatch();
    }

    function handleMatch() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);
      matchedPairs++;
      score += 10;
      document.getElementById('score').textContent = score;

      if (matchedPairs === symbols.length / 2) {
        clearInterval(timerInterval);
        checkBestTime();
        setTimeout(() => alert(`🎉 You finished in ${timer} seconds!\n🏆 Score: ${score}`), 300);
      }
      resetBoard();
    }

    function handleNoMatch() {
      lockBoard = true;
      score -= 2;
      document.getElementById('score').textContent = score;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        firstCard.querySelector('img').style.visibility = 'hidden';
        secondCard.querySelector('img').style.visibility = 'hidden';
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function checkBestTime() {
      if (!bestTime || timer < bestTime) {
        bestTime = timer;
        localStorage.setItem('bestTime', bestTime);
        document.getElementById('bestTime').textContent = bestTime;
        alert("🎖️ New Best Time! Great job!");
      }
    }

    startGame();
  </script>

</body>
</html>
